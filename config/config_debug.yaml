defaults:
  - config
  - _self_
  - override llm: openai_debug
  - override output: debug

# Debug-specific overrides
patient_case: "ילד בן 3 עם עיכוב בהתפתחות השפה"

# Debug logging
logging:
  level: "DEBUG"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(funcName)s:%(lineno)d - %(message)s"
