e<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות - Lihi's Assistant</title>

    <!-- Bootstrap CSS RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts - Hebrew friendly -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="{{ url_for('static', path='/css/styles.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Hero Section -->
        <div class="hero-section text-center position-relative" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
            <div class="floating-shapes">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
            </div>

            <div class="row justify-content-center w-100">
                <div class="col-lg-5 col-md-7">
                    <!-- Logo and Title -->
                    <div class="text-center mb-4">
                        <div class="mb-3">
                            <i class="fas fa-comments-dots fa-4x text-primary"></i>
                        </div>
                        <h1 class="display-4 mb-2">Lihi's Assistant</h1>
                        <p class="lead text-muted">מערכת חכמה ליצירת תכניות טיפול בדיבור</p>
                    </div>

                    <!-- Login Card -->
                    <div class="card">
                        <div class="card-header text-center">
                            <h2 class="mb-0">
                                <i class="fas fa-sign-in-alt me-2"></i>
                                התחברות למערכת
                            </h2>
                        </div>
                        <div class="card-body p-4">
                            {% if error %}
                            <div class="alert alert-danger" role="alert">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                {{ error }}
                            </div>
                            {% endif %}

                            <form id="loginForm" method="POST" action="/login" class="needs-validation" novalidate>
                                <!-- Email -->
                                <div class="mb-4">
                                    <label for="email" class="form-label">
                                        <i class="fas fa-envelope me-2"></i>
                                        כתובת אימייל
                                    </label>
                                    <input
                                        type="email"
                                        class="form-control"
                                        id="email"
                                        name="email"
                                        placeholder="your@email.com"
                                        required
                                        autofocus
                                    >
                                    <div class="invalid-feedback">
                                        נא להזין כתובת אימייל תקינה
                                    </div>
                                </div>

                                <!-- Password -->
                                <div class="mb-4">
                                    <label for="password" class="form-label">
                                        <i class="fas fa-lock me-2"></i>
                                        סיסמה
                                    </label>
                                    <input
                                        type="password"
                                        class="form-control"
                                        id="password"
                                        name="password"
                                        placeholder="הזן סיסמה"
                                        required
                                    >
                                    <div class="invalid-feedback">
                                        נא להזין סיסמה
                                    </div>
                                </div>

                                <!-- Submit Button -->
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary btn-lg">
                                        <i class="fas fa-sign-in-alt me-2"></i>
                                        התחבר
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Features badges -->
                    <div class="d-flex justify-content-center gap-3 flex-wrap mt-4">
                        <span class="badge bg-primary-subtle text-primary-emphasis px-3 py-2">
                            <i class="fas fa-users me-2"></i>צוות רב-מקצועי
                        </span>
                        <span class="badge bg-success-subtle text-success-emphasis px-3 py-2">
                            <i class="fas fa-child me-2"></i>התמחות בילדים
                        </span>
                        <span class="badge bg-info-subtle text-info-emphasis px-3 py-2">
                            <i class="fas fa-brain me-2"></i>AI מתקדם
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-auto py-4" style="position: fixed; bottom: 0; width: 100%;">
        <div class="container text-center">
            <p class="mb-0 text-muted small">
                <i class="fas fa-heart text-danger"></i>
                נוצר עבור קלינאיות תקשורת מובילות
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    // Form validation
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        if (!this.checkValidity()) {
            e.preventDefault();
            e.stopPropagation();
        }
        this.classList.add('was-validated');
    });
    </script>
</body>
</html>
